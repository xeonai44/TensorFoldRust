[workspace]
resolver = "2"
members = [
    "crates/engine",
    "crates/safetensors",
    "crates/core",
    "crates/lanes",
    "crates/cuda",
    "crates/metal",
    "crates/qwen35",
    "crates/glm",
    "crates/nemotron",
    "crates/server",
    "crates/cli",
]

[workspace.package]
version = "0.1.0-phase0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"
repository = "https://github.com/ashhart/TensorFold"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.10"
sha2 = "0.10"
memmap2 = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
axum = "0.8"
clap = { version = "4", features = ["derive"] }
tokenizers = "0.21"
minijinja = "2"
metal = "0.31"
objc = "0.2"

[profile.release]
lto = "thin"
