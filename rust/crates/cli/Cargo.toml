[package]
name = "tensorfold-native"
description = "tensorfold-native: the native engine's command line (port of zig/src/server/main.zig and cli/)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "tensorfold-native"
path = "src/main.rs"

[dependencies]
tensorfold-engine = { path = "../engine" }
tensorfold-core = { path = "../core" }
tensorfold-server = { path = "../server" }
tensorfold-lanes = { path = "../lanes" }
tensorfold-qwen35 = { path = "../qwen35" }
tensorfold-nemotron = { path = "../nemotron" }
tensorfold-cuda = { path = "../cuda" }
clap.workspace = true
tokio.workspace = true
serde_json.workspace = true
ureq = { version = "2", features = ["native-tls"] }
sha1 = "0.10"
sha2 = "0.10"
